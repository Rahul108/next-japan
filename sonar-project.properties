sonar.projectKey=next-japan-project
sonar.organization=your-organization
sonar.projectName=Next Japan Project
sonar.projectVersion=1.0

# Paths
sonar.sources=src
sonar.tests=__tests__
sonar.exclusions=**/node_modules/**,**/coverage/**,**/*.config.js,**/public/**

# Language
sonar.language=js

# Coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.test.js,**/*.spec.js,**/jest.config.js,**/jest.setup.js

# Test results
sonar.testExecutionReportPaths=test-report.xml

name: Setup Monitoring Stack (Prometheus + Grafana)

on:
  push:
    branches:
      - chore/workflow-test
  workflow_dispatch:

jobs:
  deploy-monitoring:
    name: Install Prometheus & Grafana on EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_PRIVATE_KEY }}" > ~/.ssh/ec2-key.pem
          chmod 600 ~/.ssh/ec2-key.pem
          ssh-keyscan -H ${{ secrets.EC2_MONITORING_HOST }} >> ~/.ssh/known_hosts

      - name: Create monitoring setup script
        run: |
          cat > setup-monitoring.sh << 'EOF'
          #!/bin/bash
          set -e
          # Update system
          sudo apt update -y

          # Install Docker if not present
          if ! command -v docker &> /dev/null; then
            curl -fsSL https://get.docker.com | sudo bash
            sudo usermod -aG docker $USER
          fi

          # Install Docker Compose if not present
          if ! command -v docker-compose &> /dev/null && ! docker compose version &> /dev/null; then
            sudo apt install -y docker-compose
          fi

          # Create Docker Compose setup
          mkdir -p ~/monitoring
          cd ~/monitoring

          cat > docker-compose.yml <<EOC
          version: '3'
          services:
            prometheus:
              image: prom/prometheus
              ports:
                - "9090:9090"
              volumes:
                - ./prometheus.yml:/etc/prometheus/prometheus.yml
            node-exporter:
              image: prom/node-exporter
              ports:
                - "9100:9100"
            grafana:
              image: grafana/grafana
              ports:
                - "3001:3000"
              environment:
                - GF_SECURITY_ADMIN_USER=admin
                - GF_SECURITY_ADMIN_PASSWORD=admin
              volumes:
                - grafana-data:/var/lib/grafana
          volumes:
            grafana-data:
          EOC

          cat > prometheus.yml <<EOP
          global:
            scrape_interval: 15s
          scrape_configs:
            - job_name: 'prometheus'
              static_configs:
                - targets: ['localhost:9090']
            - job_name: 'node-exporter'
              static_configs:
                - targets: ['localhost:9100']
          EOP

          # Start stack
          docker compose down || true
          docker compose up -d
          EOF
          chmod +x setup-monitoring.sh

      - name: Copy setup script to EC2
        run: |
          scp -i ~/.ssh/ec2-key.pem setup-monitoring.sh ubuntu@${{ secrets.EC2_MONITORING_HOST }}:/tmp/

      - name: Run setup script on EC2
        run: |
          ssh -i ~/.ssh/ec2-key.pem ubuntu@${{ secrets.EC2_MONITORING_HOST }} 'bash /tmp/setup-monitoring.sh'

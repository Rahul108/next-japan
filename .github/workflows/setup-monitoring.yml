name: Setup Grafana and Prometheus Monitoring

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to setup monitoring for'
        required: true
        default: 'production'
        type: choice
        options:
        - production
        - staging
      setup_type:
        description: 'Setup type'
        required: true
        default: 'full'
        type: choice
        options:
        - full
        - prometheus-only
        - grafana-only

env:
  PROMETHEUS_VERSION: "2.45.0"
  GRAFANA_VERSION: "10.0.0"

jobs:
  setup-monitoring:
    runs-on: ubuntu-latest
    environment: 
      name: ${{ github.event.inputs.environment }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}         # Uncomment and add to secrets
          # aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}  # Uncomment and add to secrets
          # aws-region: ${{ secrets.AWS_REGION }}                       # Uncomment and add to secrets
          aws-access-key-id: "PLACEHOLDER_ACCESS_KEY"
          aws-secret-access-key: "PLACEHOLDER_SECRET_KEY"
          aws-region: "us-east-1"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          # echo "${{ secrets.EC2_PRIVATE_KEY }}" > ~/.ssh/ec2-key.pem  # Uncomment when key is added
          # chmod 600 ~/.ssh/ec2-key.pem
          echo "# SSH key placeholder" > ~/.ssh/ec2-key.pem

      - name: Create Prometheus configuration
        run: |
          mkdir -p monitoring/prometheus
          cat > monitoring/prometheus/prometheus.yml << 'EOF'
          global:
            scrape_interval: 15s
            evaluation_interval: 15s
          
          rule_files:
            - "rules/*.yml"
          
          alerting:
            alertmanagers:
              - static_configs:
                  - targets:
                    - alertmanager:9093
          
          scrape_configs:
            - job_name: 'prometheus'
              static_configs:
                - targets: ['localhost:9090']
          
            - job_name: 'node-exporter'
              static_configs:
                - targets: ['localhost:9100']
          
            - job_name: 'next-japan-app'
              static_configs:
                - targets: ['localhost:3000']
              metrics_path: '/api/metrics'
              scrape_interval: 30s
          
            - job_name: 'docker'
              static_configs:
                - targets: ['localhost:9323']
          
            - job_name: 'nginx'
              static_configs:
                - targets: ['localhost:9113']
          EOF

      - name: Create Prometheus rules
        run: |
          mkdir -p monitoring/prometheus/rules
          cat > monitoring/prometheus/rules/app.yml << 'EOF'
          groups:
            - name: next-japan-app
              rules:
                - alert: HighErrorRate
                  expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
                  for: 5m
                  labels:
                    severity: critical
                  annotations:
                    summary: "High error rate detected"
                    description: "Error rate is {{ $value }} errors per second"
          
                - alert: HighResponseTime
                  expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
                  for: 5m
                  labels:
                    severity: warning
                  annotations:
                    summary: "High response time detected"
                    description: "95th percentile response time is {{ $value }} seconds"
          
                - alert: ApplicationDown
                  expr: up{job="next-japan-app"} == 0
                  for: 1m
                  labels:
                    severity: critical
                  annotations:
                    summary: "Next.js application is down"
                    description: "The Next.js application has been down for more than 1 minute"
          
                - alert: HighMemoryUsage
                  expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes > 0.9
                  for: 5m
                  labels:
                    severity: warning
                  annotations:
                    summary: "High memory usage"
                    description: "Memory usage is above 90%"
          
                - alert: HighCPUUsage
                  expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
                  for: 5m
                  labels:
                    severity: warning
                  annotations:
                    summary: "High CPU usage"
                    description: "CPU usage is above 80%"
          
                - alert: DiskSpaceLow
                  expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 10
                  for: 5m
                  labels:
                    severity: critical
                  annotations:
                    summary: "Low disk space"
                    description: "Disk space is below 10%"
          EOF

      - name: Create Grafana provisioning
        run: |
          mkdir -p monitoring/grafana/provisioning/{datasources,dashboards}
          
          # Datasources
          cat > monitoring/grafana/provisioning/datasources/prometheus.yml << 'EOF'
          apiVersion: 1
          
          datasources:
            - name: Prometheus
              type: prometheus
              access: proxy
              url: http://prometheus:9090
              isDefault: true
              editable: true
          EOF
          
          # Dashboard config
          cat > monitoring/grafana/provisioning/dashboards/dashboard.yml << 'EOF'
          apiVersion: 1
          
          providers:
            - name: 'default'
              orgId: 1
              folder: ''
              type: file
              disableDeletion: false
              updateIntervalSeconds: 10
              allowUiUpdates: true
              options:
                path: /etc/grafana/provisioning/dashboards
          EOF

      - name: Create Grafana dashboard
        run: |
          cat > monitoring/grafana/provisioning/dashboards/next-japan-dashboard.json << 'EOF'
          {
            "dashboard": {
              "id": null,
              "title": "Next Japan Application Dashboard",
              "tags": ["next.js", "application"],
              "timezone": "browser",
              "panels": [
                {
                  "id": 1,
                  "title": "Request Rate",
                  "type": "graph",
                  "targets": [
                    {
                      "expr": "rate(http_requests_total{job=\"next-japan-app\"}[5m])",
                      "legendFormat": "Requests/sec"
                    }
                  ],
                  "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
                },
                {
                  "id": 2,
                  "title": "Response Time",
                  "type": "graph",
                  "targets": [
                    {
                      "expr": "histogram_quantile(0.50, rate(http_request_duration_seconds_bucket{job=\"next-japan-app\"}[5m]))",
                      "legendFormat": "50th percentile"
                    },
                    {
                      "expr": "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job=\"next-japan-app\"}[5m]))",
                      "legendFormat": "95th percentile"
                    }
                  ],
                  "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}
                },
                {
                  "id": 3,
                  "title": "Error Rate",
                  "type": "graph",
                  "targets": [
                    {
                      "expr": "rate(http_requests_total{job=\"next-japan-app\",status=~\"4..\"}[5m])",
                      "legendFormat": "4xx errors"
                    },
                    {
                      "expr": "rate(http_requests_total{job=\"next-japan-app\",status=~\"5..\"}[5m])",
                      "legendFormat": "5xx errors"
                    }
                  ],
                  "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}
                },
                {
                  "id": 4,
                  "title": "System Resources",
                  "type": "graph",
                  "targets": [
                    {
                      "expr": "100 - (avg by(instance) (irate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)",
                      "legendFormat": "CPU Usage %"
                    },
                    {
                      "expr": "(node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100",
                      "legendFormat": "Memory Usage %"
                    }
                  ],
                  "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}
                }
              ],
              "time": {"from": "now-1h", "to": "now"},
              "refresh": "30s"
            }
          }
          EOF

      - name: Create Docker Compose for monitoring stack
        run: |
          cat > monitoring/docker-compose.yml << 'EOF'
          version: '3.8'
          
          services:
            prometheus:
              image: prom/prometheus:v2.45.0
              container_name: prometheus
              restart: unless-stopped
              ports:
                - "9090:9090"
              volumes:
                - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
                - ./prometheus/rules:/etc/prometheus/rules
                - prometheus_data:/prometheus
              command:
                - '--config.file=/etc/prometheus/prometheus.yml'
                - '--storage.tsdb.path=/prometheus'
                - '--web.console.libraries=/etc/prometheus/console_libraries'
                - '--web.console.templates=/etc/prometheus/consoles'
                - '--web.enable-lifecycle'
                - '--web.enable-admin-api'
              networks:
                - monitoring
          
            grafana:
              image: grafana/grafana:10.0.0
              container_name: grafana
              restart: unless-stopped
              ports:
                - "3001:3000"
              volumes:
                - grafana_data:/var/lib/grafana
                - ./grafana/provisioning:/etc/grafana/provisioning
              environment:
                - GF_SECURITY_ADMIN_PASSWORD=admin123  # Change this in production
                - GF_USERS_ALLOW_SIGN_UP=false
                - GF_SECURITY_ADMIN_USER=admin
              networks:
                - monitoring
          
            node-exporter:
              image: prom/node-exporter:latest
              container_name: node-exporter
              restart: unless-stopped
              ports:
                - "9100:9100"
              volumes:
                - /proc:/host/proc:ro
                - /sys:/host/sys:ro
                - /:/rootfs:ro
              command:
                - '--path.procfs=/host/proc'
                - '--path.rootfs=/rootfs'
                - '--path.sysfs=/host/sys'
                - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
              networks:
                - monitoring
          
            alertmanager:
              image: prom/alertmanager:latest
              container_name: alertmanager
              restart: unless-stopped
              ports:
                - "9093:9093"
              volumes:
                - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
                - alertmanager_data:/alertmanager
              networks:
                - monitoring
          
          volumes:
            prometheus_data:
            grafana_data:
            alertmanager_data:
          
          networks:
            monitoring:
              driver: bridge
          EOF

      - name: Create Alertmanager configuration
        run: |
          mkdir -p monitoring/alertmanager
          cat > monitoring/alertmanager/alertmanager.yml << 'EOF'
          global:
            smtp_smarthost: 'localhost:587'
            smtp_from: 'alerts@example.com'
          
          route:
            group_by: ['alertname']
            group_wait: 10s
            group_interval: 10s
            repeat_interval: 1h
            receiver: 'web.hook'
          
          receivers:
            - name: 'web.hook'
              webhook_configs:
                - url: 'http://localhost:5001/webhook'
              email_configs:
                - to: 'admin@example.com'
                  subject: 'Alert: {{ .GroupLabels.alertname }}'
                  body: |
                    {{ range .Alerts }}
                    Alert: {{ .Annotations.summary }}
                    Description: {{ .Annotations.description }}
                    {{ end }}
          EOF

      - name: Create setup script
        run: |
          cat > monitoring/setup.sh << 'EOF'
          #!/bin/bash
          set -e
          
          echo "🔧 Setting up Prometheus and Grafana monitoring stack..."
          
          # Create directories
          sudo mkdir -p /opt/monitoring
          sudo cp -r monitoring/* /opt/monitoring/
          
          # Set permissions
          sudo chown -R $USER:$USER /opt/monitoring
          
          # Install Docker and Docker Compose if not present
          if ! command -v docker &> /dev/null; then
              echo "📦 Installing Docker..."
              curl -fsSL https://get.docker.com -o get-docker.sh
              sudo sh get-docker.sh
              sudo usermod -aG docker $USER
          fi
          
          if ! command -v docker-compose &> /dev/null; then
              echo "📦 Installing Docker Compose..."
              sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
          fi
          
          # Start the monitoring stack
          cd /opt/monitoring
          echo "🚀 Starting monitoring stack..."
          docker-compose up -d
          
          # Wait for services to start
          echo "⏳ Waiting for services to start..."
          sleep 30
          
          # Verify services
          echo "🔍 Verifying services..."
          if curl -f http://localhost:9090 >/dev/null 2>&1; then
              echo "✅ Prometheus is running on http://localhost:9090"
          else
              echo "❌ Prometheus failed to start"
          fi
          
          if curl -f http://localhost:3001 >/dev/null 2>&1; then
              echo "✅ Grafana is running on http://localhost:3001"
              echo "   Default login: admin/admin123"
          else
              echo "❌ Grafana failed to start"
          fi
          
          if curl -f http://localhost:9100 >/dev/null 2>&1; then
              echo "✅ Node Exporter is running on http://localhost:9100"
          else
              echo "❌ Node Exporter failed to start"
          fi
          
          echo ""
          echo "🎉 Monitoring stack setup complete!"
          echo ""
          echo "📊 Access URLs:"
          echo "  - Prometheus: http://localhost:9090"
          echo "  - Grafana: http://localhost:3001 (admin/admin123)"
          echo "  - Node Exporter: http://localhost:9100"
          echo "  - Alertmanager: http://localhost:9093"
          echo ""
          echo "📝 Next steps:"
          echo "  1. Change Grafana admin password"
          echo "  2. Configure alert notifications"
          echo "  3. Add application metrics endpoint"
          echo "  4. Set up SSL certificates"
          EOF
          
          chmod +x monitoring/setup.sh

      - name: Deploy monitoring stack to EC2
        if: github.event.inputs.setup_type == 'full' || github.event.inputs.setup_type == 'prometheus-only' || github.event.inputs.setup_type == 'grafana-only'
        run: |
          # Note: Uncomment these lines when EC2 credentials are configured
          # scp -i ~/.ssh/ec2-key.pem -r monitoring ubuntu@${{ secrets.EC2_HOST }}:~/
          # ssh -i ~/.ssh/ec2-key.pem ubuntu@${{ secrets.EC2_HOST }} 'cd monitoring && bash setup.sh'
          
          echo "📁 Monitoring configuration files created"
          echo "🔧 To deploy to EC2, you need to:"
          echo "  1. Add EC2_PRIVATE_KEY to GitHub secrets"
          echo "  2. Add EC2_HOST to GitHub secrets"
          echo "  3. Uncomment the deployment commands above"
          echo ""
          echo "📋 Manual deployment steps:"
          echo "  1. Copy the monitoring folder to your EC2 instance"
          echo "  2. Run: cd monitoring && bash setup.sh"

      - name: Create monitoring summary
        run: |
          echo "## 📊 Monitoring Stack Setup Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Setup Type:** ${{ github.event.inputs.setup_type }}" >> $GITHUB_STEP_SUMMARY
          echo "**Prometheus Version:** ${{ env.PROMETHEUS_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Grafana Version:** ${{ env.GRAFANA_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Components Configured:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Prometheus (metrics collection)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Grafana (visualization)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Node Exporter (system metrics)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Alertmanager (notifications)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎯 Monitoring Targets:" >> $GITHUB_STEP_SUMMARY
          echo "- Next.js application (port 3000)" >> $GITHUB_STEP_SUMMARY
          echo "- System resources (CPU, Memory, Disk)" >> $GITHUB_STEP_SUMMARY
          echo "- Docker containers" >> $GITHUB_STEP_SUMMARY
          echo "- Web server (if applicable)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚨 Alerts Configured:" >> $GITHUB_STEP_SUMMARY
          echo "- High error rate (>10%)" >> $GITHUB_STEP_SUMMARY
          echo "- High response time (>1s)" >> $GITHUB_STEP_SUMMARY
          echo "- Application down" >> $GITHUB_STEP_SUMMARY
          echo "- High memory usage (>90%)" >> $GITHUB_STEP_SUMMARY
          echo "- High CPU usage (>80%)" >> $GITHUB_STEP_SUMMARY
          echo "- Low disk space (<10%)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📁 Files Created:" >> $GITHUB_STEP_SUMMARY
          echo "- \`monitoring/docker-compose.yml\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`monitoring/prometheus/prometheus.yml\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`monitoring/grafana/provisioning/\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`monitoring/alertmanager/alertmanager.yml\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`monitoring/setup.sh\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload monitoring artifacts
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-configuration-${{ github.event.inputs.environment }}
          path: monitoring/
          retention-days: 30

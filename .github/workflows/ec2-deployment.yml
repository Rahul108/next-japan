name: Deploy to EC2

on:
  push:
    branches:
      - chore/workflow-test
  workflow_run:
    workflows: ["Docker Build and Push"]
    types:
      - completed
    branches: 
      - chore/workflow-test
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
        - production
        - staging

env:
  IMAGE_NAME: prefixsarker/next-japan

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    
    environment: 
      name: ${{ github.event.inputs.environment || 'production' }}
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Uncomment when you need AWS credentials for EC2 management
      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #     aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_PRIVATE_KEY }}" > ~/.ssh/ec2-key.pem
          chmod 600 ~/.ssh/ec2-key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Create deployment script
        run: |
          cat > deploy.sh << 'EOF'
          #!/bin/bash
          set -e
          CONTAINER_NAME="next-japan-app"
          IMAGE_NAME="prefixsarker/next-japan:latest"
          PORT="3000"
          docker pull $IMAGE_NAME
          docker stop $CONTAINER_NAME 2>/dev/null || true
          docker rm $CONTAINER_NAME 2>/dev/null || true
          docker run -d \
            --name $CONTAINER_NAME \
            --restart unless-stopped \
            -p $PORT:3000 \
            -e NODE_ENV=production \
            $IMAGE_NAME
          sleep 10
          if curl -f http://localhost:$PORT/health 2>/dev/null || curl -f http://localhost:$PORT 2>/dev/null; then
            exit 0
          else
            docker logs $CONTAINER_NAME
            exit 1
          fi
          docker image prune -f
          EOF
          chmod +x deploy.sh

      - name: Deploy to EC2
        id: deploy
        run: |
          scp -i ~/.ssh/ec2-key.pem deploy.sh ubuntu@${{ secrets.EC2_HOST }}:/tmp/
          ssh -i ~/.ssh/ec2-key.pem ubuntu@${{ secrets.EC2_HOST }} 'bash /tmp/deploy.sh'
          echo "url=http://your-ec2-instance.com" >> $GITHUB_OUTPUT

      # - name: Health check
      #   if: success()
      #   run: |
      #     timeout 60 bash -c 'while [[ "$(curl -s -o /dev/null -w ''%{http_code}'' http://${{ secrets.EC2_HOST }})" != "200" ]]; do sleep 5; done'

      # - name: Rollback on failure
      #   if: failure()
      #   run: |
      #     ssh -i ~/.ssh/ec2-key.pem ubuntu@${{ secrets.EC2_HOST }} 'docker stop next-japan-app && docker run -d --name next-japan-app -p 3000:3000 prefixsarker/next-japan:previous'

      # - name: Notify deployment status
      #   if: always()
      #   run: |
      #     # Add notification integrations here (Slack, Teams, etc.)
      #     # curl -X POST -H 'Content-type: application/json' \
      #     #   --data '{"text":"Deployment ${{ job.status }} for ${{ github.repository }}"}' \
      #     #   ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Update deployment summary
        if: always()
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "Environment: ${{ github.event.inputs.environment || 'production' }}" >> $GITHUB_STEP_SUMMARY
          echo "Image: ${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "Triggered by: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "URL: ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          fi
